<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width,initial-scale=1" name="viewport">
        <title>EX07 Photo Gallery</title>
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1>Galeria de fotografias</h1>
            <p>Galeria responsiva </p>
        </header>
        <main class="gallery">
            <figure class="wide"><img alt="Paisagem de montanhas" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80"><figcaption>Montanhas</figcaption></figure>
            <figure><img alt="Lago" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=700&q=80"><figcaption>Lago</figcaption></figure>
            <figure class="forest"><img alt="Floresta" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=700&q=80"><figcaption>Floresta</figcaption></figure>
            <figure><img alt="Praia" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=700&q=80"><figcaption>Praia</figcaption></figure>
            <figure class="peaks"><img alt="Picos" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=700&q=80"><figcaption>Picos</figcaption></figure>
            <figure class="sun"><img alt="Amanhecer" src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=80"><figcaption>Amanhecer</figcaption></figure>
        </main>
        <footer>Thaniel Jorge </footer>
    </body>
</html>
