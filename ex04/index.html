<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width,initial-scale=1" name="viewport">
        <title>EX04 Components</title>
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1>Componentes reutilizáveis</h1>
            <p>Exercicio 4</p>
        </header>
        <main>
            <section>
                <h2>Card e badge</h2>
                <article class="card">
                    <span class="badge">Novo</span>
                    <h3>Plano básico</h3>
                    <p>Uma solução simples para começar.</p>
                    <button class="btn">Saber mais</button>
                </article>
            </section>
            <section>
                <h2>Botões</h2>
                <button class="btn">Principal</button>
                <button class="btn secondary">Secundário</button>
            </section>
            <section>
                <h2>Alertas</h2>
                <p class="alert success">Operação concluída com sucesso.</p>
                <p class="alert warning">Confirma os dados antes de continuar.</p>
            </section>
            <section>
                <h2>Formulário</h2>
                <form action="#" method="get">
                    <label for="nome">Nome</label>
                    <input id="nome" name="nome" required="">
                    <label for="email">Email</label>
                    <input id="email" name="email" required="" type="email">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" required="" rows="4"></textarea>
                    <button class="btn" type="submit">Enviar</button>
                </form>
            </section>
        </main>
        <footer>Thaniel Jorge</footer>
    </body>
</html>
