<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width,initial-scale=1" name="viewport">
        <title>EX02 Box Model</title>
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1>Box Model</h1>
            <p>Cartões e comparação de box-sizing.</p>
        </header>
        <main>
            <section class="cards">
                <article class="card">
                    <h2>Cartão 1</h2>
                    <p>width, padding, border e margin.</p>
                </article>
                <article class="card">
                    <h2>Cartão 2</h2>
                    <p>Usa border-box.</p>
                </article>
                <article class="card">
                    <h2>Cartão 3</h2>
                    <p>Dimensões previsíveis.</p>
                </article>
            </section>
            <section class="compare">
                <article class="content">
                    <h2>content-box</h2>
                    <p>Padding e border somam à largura.</p>
                </article>
                <article class="border">
                    <h2>border-box</h2>
                    <p>A largura inclui padding e border.</p>
                </article>
            </section>
        </main>
        <footer>Thaniel Jorge </footer>
    </body>
</html>
